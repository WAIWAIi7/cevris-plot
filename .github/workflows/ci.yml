name: Cevris Plot checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/import.test.mjs tests/data.test.mjs tests/client.test.mjs tests/installer.test.mjs tests/archive.test.mjs tests/host-registration.test.mjs
      - run: npm run check:release
      - run: node scripts/package.mjs --source
      - run: npm audit --omit=dev --audit-level=high
  windows-r:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - run: npm ci
      - name: Install R packages and select interpreter
        shell: pwsh
        run: |
          Rscript --vanilla scripts/setup-r.R
          if ($LASTEXITCODE -ne 0) { throw 'R setup failed' }
          "FIGURE_RSCRIPT=$((Get-Command Rscript).Source)" >> $env:GITHUB_ENV
      - run: npm run build
      - run: npm test
      - run: npm run verify:r
      - run: node scripts/verify-r-source.mjs
      - run: npm run check:release
      - run: node scripts/package.mjs
  portable-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install R by file extraction and verify offline repeat
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $before = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | Where-Object PSChildName -Like 'R for Windows*' | Sort-Object PSChildName | ForEach-Object { Get-ItemProperty $_.PSPath | Select-Object * -ExcludeProperty PS* } | ConvertTo-Json -Depth 4)
          & ./scripts/install.ps1
          & ./scripts/install.ps1 -Offline
          $env:TEMP = Join-Path $PWD '.runtime/tmp'
          $env:TMP = $env:TEMP
          $probe = Join-Path $env:TEMP 'first-launch-probe.R'
          'stopifnot(dir.exists(Sys.getenv("TEMP")), file.access(Sys.getenv("TEMP"), 2L) == 0L); stopifnot(startsWith(normalizePath(tempdir(), winslash="/"), normalizePath(Sys.getenv("TEMP"), winslash="/")))' | Set-Content -LiteralPath $probe
          & ./.runtime/R/bin/x64/Rscript.exe --vanilla $probe
          if ($LASTEXITCODE -ne 0) { throw 'First-launch R temporary directory is not usable.' }
          $after = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | Where-Object PSChildName -Like 'R for Windows*' | Sort-Object PSChildName | ForEach-Object { Get-ItemProperty $_.PSPath | Select-Object * -ExcludeProperty PS* } | ConvertTo-Json -Depth 4)
          if (($before -join '') -ne ($after -join '')) { throw 'R uninstall registry changed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-install-log
          path: .data/install.log
